[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "SIM", "B", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["config", "worker", "agent", "cache", "queue_integration", "chrome_lifecycle", "cdp_wrapper", "cdp_use", "status_server", "eventlog", "work_queue", "search", "extractor"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017", "S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
